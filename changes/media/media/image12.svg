<svg width="721" height="1015" viewBox="0 0 721 1015" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" overflow="hidden"><defs></defs><g><g id="ent0002"><rect x="342.97" y="7" rx="7" ry="7" width="134.092" height="52.5938" stroke="#334155" stroke-width="0.5" fill="#DBEAFE"/><text fill="#0F172A" font-family="Arial" font-size="14" x="352.97" y="29.9951">Вхідний сигнал</text><text fill="#0F172A" font-family="Arial" font-size="14" x="358.962" y="46.292">x(n), n = 0..15</text></g><g id="ent0003"><rect x="312.83" y="120.59" rx="7" ry="7" width="194.385" height="101.484" stroke="#334155" stroke-width="0.5" fill="#FEF3C7"/><text fill="#0F172A" font-family="Arial" font-size="14" x="322.83" y="143.585">Індексне відображення</text><text fill="#0F172A" font-family="Arial" font-size="14" x="359.45" y="159.882">────────────</text><text fill="#0F172A" font-family="Arial" font-size="14" x="373.976" y="176.179">n = 4s + r</text><text fill="#0F172A" font-family="Arial" font-size="14" x="367.164" y="192.476">k = 4k₂ + k₁</text><text fill="#0F172A" font-family="Arial" font-size="14" x="332.482" y="208.773">r, s, k₁, k₂ ∈ {0,1,2,3}</text></g><g id="ent0004"><rect x="336.57" y="283.08" rx="7" ry="7" width="146.902" height="85.1875" stroke="#334155" stroke-width="0.5" fill="#E0F2FE"/><text fill="#0F172A" font-family="Arial" font-size="14" x="353.184" y="306.075">Матриця A[r][s]</text><text fill="#0F172A" font-family="Arial" font-size="14" x="359.449" y="322.372">────────────</text><text fill="#0F172A" font-family="Arial" font-size="14" x="346.57" y="338.669">A[r][s] = x(4s + r)</text><text fill="#0F172A" font-family="Arial" font-size="14" x="368.906" y="354.966">розмір 4×4</text></g><g id="ent0005"><rect x="282" y="429.26" rx="7" ry="7" width="256.038" height="101.484" stroke="#334155" stroke-width="0.5" fill="#DCFCE7"/><text fill="#0F172A" font-family="Arial" font-size="14" x="376.991" y="452.255">СТАДІЯ 1</text><text fill="#0F172A" font-family="Arial" font-size="14" x="359.447" y="468.552">────────────</text><text fill="#0F172A" font-family="Arial" font-size="14" x="305.576" y="484.849">4 паралельні рядкові ДПФ-4</text><text fill="#0F172A" font-family="Arial" font-size="14" x="300.09" y="501.146">G_r(k₁) = Σ_s A[r][s]·W₄^{s·k₁}</text><text fill="#0F172A" font-family="Arial" font-size="14" x="292" y="517.443">(8 додавань кожне, 0 множень)</text></g><g id="ent0006"><rect x="282.73" y="607.75" rx="7" ry="7" width="254.575" height="101.484" stroke="#334155" stroke-width="0.5" fill="#EDE9FE"/><text fill="#0F172A" font-family="Arial" font-size="14" x="376.99" y="630.745">СТАДІЯ 2</text><text fill="#0F172A" font-family="Arial" font-size="14" x="359.445" y="647.042">────────────</text><text fill="#0F172A" font-family="Arial" font-size="14" x="312.845" y="663.339">16 множень на W₁₆^{r·k₁}</text><text fill="#0F172A" font-family="Arial" font-size="14" x="310.121" y="679.636">H_r(k₁) = W₁₆^{r·k₁}·G_r(k₁)</text><text fill="#0F172A" font-family="Arial" font-size="14" x="292.73" y="695.933">7 тривіальних, 9 нетривіальних</text></g><g id="ent0007"><rect x="7" y="786.23" rx="7" ry="7" width="256.038" height="101.484" stroke="#334155" stroke-width="0.5" fill="#DCFCE7"/><text fill="#0F172A" font-family="Arial" font-size="14" x="101.991" y="809.225">СТАДІЯ 3</text><text fill="#0F172A" font-family="Arial" font-size="14" x="84.4468" y="825.522">────────────</text><text fill="#0F172A" font-family="Arial" font-size="14" x="22.5986" y="841.819">4 паралельні стовпцеві ДПФ-4</text><text fill="#0F172A" font-family="Arial" font-size="14" x="44.231" y="858.116">X = Σ_r H_r(k₁)·W₄^{r·k₂}</text><text fill="#0F172A" font-family="Arial" font-size="14" x="17" y="874.413">(8 додавань кожне, 0 множень)</text></g><g id="ent0008"><rect x="63.36" y="948.72" rx="7" ry="7" width="143.32" height="52.5938" stroke="#334155" stroke-width="0.5" fill="#FFE4E6"/><text fill="#0F172A" font-family="Arial" font-size="14" x="73.36" y="971.715">Вихідний спектр</text><text fill="#0F172A" font-family="Arial" font-size="14" x="84.0788" y="988.012">X(k), k = 0..15</text></g><g id="ent0016"><path d="M297.81 809.27 297.81 864.668 297.81 864.668 706.22 864.668 706.22 864.668 706.22 819.27 696.22 809.27 492.09 809.27 436.14 709.59 484.09 809.27 297.81 809.27 297.81 809.27" stroke="#181818" stroke-width="0.5" fill="#FEFFDD"/><path d="M696.22 809.27 696.22 819.27 706.22 819.27 696.22 809.27" stroke="#181818" stroke-width="0.5" fill="#FEFFDD"/><text font-family="Arial" font-size="13" x="424.507" y="826.337">Підсумок для N = 16:</text><text font-family="Arial" font-size="13" x="308.015" y="841.47">9 нетривіальних комплексних множень + 80 додавань</text><text font-family="Arial" font-size="13" x="303.81" y="856.602">проти 256 множень прямого ДПФ → прискорення ≈ 28×</text></g><g id="lnk9"><path d="M410.02 59.88C410.02 76.89 410.02 93.8 410.02 114.34" id="X-to-MAP" stroke="#334155" fill="none"/><path d="M410.02 120.34 414.02 111.34 410.02 115.34 406.02 111.34 410.02 120.34Z" stroke="#334155" fill="#334155"/></g><g id="lnk10"><path d="M410.02 222.21C410.02 241.82 410.02 258.09 410.02 276.84" id="MAP-to-A" stroke="#334155" fill="none"/><path d="M410.02 282.84 414.02 273.84 410.02 277.84 406.02 273.84 410.02 282.84Z" stroke="#334155" fill="#334155"/></g><g id="lnk11"><path d="M410.02 368.7C410.02 387.37 410.02 403.49 410.02 423" id="A-to-S1" stroke="#334155" fill="none"/><path d="M410.02 429 414.02 420 410.02 424 406.02 420 410.02 429Z" stroke="#334155" fill="#334155"/></g><g id="lnk12"><path d="M410.02 531.11C410.02 554.95 410.02 577.4 410.02 601.26" id="S1-to-S2" stroke="#334155" fill="none"/><path d="M410.02 607.26 414.02 598.26 410.02 602.26 406.02 598.26 410.02 607.26Z" stroke="#334155" fill="#334155"/><text fill="#334155" font-family="Arial" font-size="13" x="411.02" y="573.817">G_r(k₁)</text></g><g id="lnk13"><path d="M331.95 709.59C294.79 733.44 255.52 758.65 218.33 782.51" id="S2-to-S3" stroke="#334155" fill="none"/><path d="M213.28 785.75 223.015 784.257 217.488 783.05 218.695 777.523 213.28 785.75Z" stroke="#334155" fill="#334155"/><text fill="#334155" font-family="Arial" font-size="13" x="282.02" y="752.297">H_r(k₁)</text></g><g id="lnk14"><path d="M135.02 887.86C135.02 908.48 135.02 925.51 135.02 942.56" id="S3-to-Y" stroke="#334155" fill="none"/><path d="M135.02 948.56 139.02 939.56 135.02 943.56 131.02 939.56 135.02 948.56Z" stroke="#334155" fill="#334155"/></g></g></svg>