<svg width="1070" height="744" viewBox="0 0 1070 744" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" overflow="hidden"><defs></defs><g><g id="ent0002"><rect x="360.37" y="7" rx="6" ry="6" width="288.447" height="150.375" stroke="#334155" stroke-width="0.5" fill="#FEF3C7"/><text fill="#0F172A" font-family="Arial" font-size="14" x="428.588" y="29.9951">КЕРУВАННЯ (Control)</text><text fill="#0F172A" font-family="Arial" font-size="14" x="454.021" y="46.292">────────────</text><text fill="#0F172A" font-family="Arial" font-size="14" x="393.886" y="62.5889">• Функціональні вимоги F1-F9</text><text fill="#0F172A" font-family="Arial" font-size="14" x="373.884" y="78.8857">• Нефункціональні вимоги NF1-NF8</text><text fill="#0F172A" font-family="Arial" font-size="14" x="374.892" y="95.1826">• Математична модель radix-4 4×4</text><text fill="#0F172A" font-family="Arial" font-size="14" x="379.058" y="111.48">• Правило активації токенів (SDF)</text><text fill="#0F172A" font-family="Arial" font-size="14" x="370.37" y="127.776">• Стандарти ISO/IEC 25010, IEEE 754</text><text fill="#0F172A" font-family="Arial" font-size="14" x="403.23" y="144.073">• Методичні вимоги до БКР</text></g><g id="ent0003"><rect x="7" y="242.53" rx="6" ry="6" width="289.192" height="150.375" stroke="#334155" stroke-width="0.5" fill="#DBEAFE"/><text fill="#0F172A" font-family="Arial" font-size="14" x="108.653" y="265.525">ВХІД (Input)</text><text fill="#0F172A" font-family="Arial" font-size="14" x="101.024" y="281.822">────────────</text><text fill="#0F172A" font-family="Arial" font-size="14" x="65.5078" y="298.119">• Сигнал x(n), n = 0..15</text><text fill="#0F172A" font-family="Arial" font-size="14" x="61.1055" y="314.416">(16 комплексних відліків)</text><text fill="#0F172A" font-family="Arial" font-size="14" x="43.6021" y="330.713">• Пресет або власний сигнал</text><text fill="#0F172A" font-family="Arial" font-size="14" x="56.4229" y="347.01">(синусоїда / імпульс / шум)</text><text fill="#0F172A" font-family="Arial" font-size="14" x="24.8271" y="363.306">• Параметри: latency, delay, speed</text><text fill="#0F172A" font-family="Arial" font-size="14" x="17" y="379.603">• Команди: Run / Pause / Step / Reset</text></g><g id="ent0004"><rect x="361.39" y="266.97" rx="6" ry="6" width="286.403" height="101.484" stroke="#334155" stroke-width="0.5" fill="#DCFCE7"/><text fill="#0F172A" font-family="Arial" font-size="14" x="495.349" y="289.965">A0</text><text fill="#0F172A" font-family="Arial" font-size="14" x="445.591" y="306.262">══════════════</text><text fill="#0F172A" font-family="Arial" font-size="14" x="375.956" y="322.559">Змоделювати потокове виконання</text><text fill="#0F172A" font-family="Arial" font-size="14" x="385.421" y="338.856">16-точкового ШПФ radix-4 (4×4)</text><text fill="#0F172A" font-family="Arial" font-size="14" x="371.39" y="355.153">та візуалізувати граф потоку даних</text></g><g id="ent0005"><rect x="762.7" y="234.38" rx="6" ry="6" width="293.8" height="166.672" stroke="#334155" stroke-width="0.5" fill="#FFE4E6"/><text fill="#0F172A" font-family="Arial" font-size="14" x="855.23" y="257.375">ВИХІД (Output)</text><text fill="#0F172A" font-family="Arial" font-size="14" x="859.028" y="273.672">────────────</text><text fill="#0F172A" font-family="Arial" font-size="14" x="823.559" y="289.969">• Спектр X(k), k = 0..15</text><text fill="#0F172A" font-family="Arial" font-size="14" x="856.963" y="306.266">(|X(k)|, arg X(k))</text><text fill="#0F172A" font-family="Arial" font-size="14" x="851.361" y="322.563">• Журнал подій</text><text fill="#0F172A" font-family="Arial" font-size="14" x="815.448" y="338.86">onToken / onFire / onOutput</text><text fill="#0F172A" font-family="Arial" font-size="14" x="794.797" y="355.156">• Метрики: throughput, latency,</text><text fill="#0F172A" font-family="Arial" font-size="14" x="818.186" y="371.453">queue size, теплова карта</text><text fill="#0F172A" font-family="Arial" font-size="14" x="772.7" y="387.75">• Звіт верифікації max|X_sim − X_ref|</text></g><g id="ent0006"><rect x="359.62" y="478.05" rx="6" ry="6" width="289.944" height="150.375" stroke="#334155" stroke-width="0.5" fill="#EDE9FE"/><text fill="#0F172A" font-family="Arial" font-size="14" x="413.999" y="501.045">МЕХАНІЗМИ (Mechanism)</text><text fill="#0F172A" font-family="Arial" font-size="14" x="454.02" y="517.342">────────────</text><text fill="#0F172A" font-family="Arial" font-size="14" x="369.62" y="533.639">• Алгоритм radix-4 (generateDFT4x4)</text><text fill="#0F172A" font-family="Arial" font-size="14" x="396.622" y="549.936">• Ядро DataflowRuntime.tick()</text><text fill="#0F172A" font-family="Arial" font-size="14" x="414.057" y="566.233">• React Flow (GraphView)</text><text fill="#0F172A" font-family="Arial" font-size="14" x="410.608" y="582.529">• Zustand store (simStore)</text><text fill="#0F172A" font-family="Arial" font-size="14" x="396.137" y="598.826">• SpectrumView / MetricsPanel</text><text fill="#0F172A" font-family="Arial" font-size="14" x="454.399" y="615.123">• Еталон fft.js</text></g><g id="ent0013"><path d="M294.55 689.42 294.55 729.686 294.55 729.686 714.64 729.686 714.64 729.686 714.64 699.42 704.64 689.42 508.6 689.42 504.6 628.68 500.6 689.42 294.55 689.42 294.55 689.42" stroke="#181818" stroke-width="0.5" fill="#FEFFDD"/><path d="M704.64 689.42 704.64 699.42 714.64 699.42 704.64 689.42" stroke="#181818" stroke-width="0.5" fill="#FEFFDD"/><text font-family="Arial" font-size="13" x="313.372" y="706.487">Нотація IDEF0: вхід (I) — зліва, керування (C) — згори,</text><text font-family="Arial" font-size="13" x="300.55" y="721.62">механізми (M) — знизу, вихід (O) — справа від функції A0.</text></g><g id="lnk7"><path d="M504.6 157.72C504.6 193.36 504.6 229.07 504.6 260.82" id="C-to-A0" stroke="#334155" fill="none"/><path d="M504.6 266.82 508.6 257.82 504.6 261.82 500.6 257.82 504.6 266.82Z" stroke="#334155" fill="#334155"/><text fill="#334155" font-family="Arial" font-size="13" x="505.6" y="200.447">правила, обмеження</text></g><g id="lnk8"><path d="M296.45 317.71C317.76 317.71 333.71 317.71 354.99 317.71" id="I-to-A0" stroke="#334155" fill="none"/><path d="M360.99 317.71 351.99 313.71 355.99 317.71 351.99 321.71 360.99 317.71Z" stroke="#334155" fill="#334155"/><text fill="#334155" font-family="Arial" font-size="13" x="314.29" y="310.777">дані</text></g><g id="lnk9"><path d="M648.24 317.71C685.31 317.71 719.27 317.71 756.52 317.71" id="A0-to-O" stroke="#334155" fill="none"/><path d="M762.52 317.71 753.52 313.71 757.52 317.71 753.52 321.71 762.52 317.71Z" stroke="#334155" fill="#334155"/><text fill="#334155" font-family="Arial" font-size="13" x="666.25" y="310.777">результати</text></g><g id="lnk11"><path d="M504.6 374.81C504.6 406.57 504.6 442.23 504.6 477.82" id="A0-backto-M" stroke="#334155" fill="none"/><path d="M504.6 368.81 500.6 377.81 504.6 373.81 508.6 377.81 504.6 368.81Z" stroke="#334155" fill="#334155"/><text fill="#334155" font-family="Arial" font-size="13" x="505.6" y="444.117">засоби</text></g></g></svg>